<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte STOR - Thomas Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f14; color: #e1e7ef; }
        .nav-bar {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: rgba(22, 27, 34, 0.95);
            border-bottom: 1px solid #21262d;
        }
        .nav-left { display: flex; align-items: center; gap: 16px; }
        .nav-left a { color: #484f58; text-decoration: none; display: flex; align-items: center; transition: color 0.2s; }
        .nav-left a:hover { color: #06b6d4; }
        .nav-left .sep { width: 1px; height: 20px; background: #21262d; }
        .nav-left .mod { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #484f58; }
        .nav-left .title { font-size: 14px; font-weight: 700; color: #e1e7ef; }
        .nav-right { font-size: 10px; font-weight: 700; color: #484f58; }
        .container { height: calc(100vh - 52px); }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    /* Theme Toggle */
[data-theme="light"] { --bg: #f5f7fa; --surface: #ffffff; --border: #d1d5db; --text: #1a1a2e; --muted: #6b7280; }
[data-theme="light"] body { background: var(--bg) !important; color: var(--text) !important; }
[data-theme="light"] .nav-bar { background: var(--surface) !important; border-color: var(--border) !important; }
[data-theme="light"] .nav-bar a { color: var(--accent, #06b6d4) !important; }
[data-theme="light"] .nav-bar span { color: var(--muted) !important; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="nav-left">
            <a href="index.html" style="display:flex;align-items:center;gap:4px;flex-shrink:0;white-space:nowrap">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span style="font-size:10px;font-weight:700;letter-spacing:.05em;color:#06b6d4;margin-left:4px">← VOLTAR</span>
            </a>
            <span class="sep"></span>
            <span class="mod">Módulo 9</span>
            <span class="sep"></span>
            <span class="title">Suporte STOR Sistemas</span>
        </div>
        <span class="nav-right">Thomas Tech</span>
    </div>
    <div class="container">
        <iframe src="https://olyrum.github.io/alltools/"></iframe>
    </div>
<script>
(function(){var t=localStorage.getItem('theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');function toggle(){var h=document.documentElement;if(h.getAttribute('data-theme')==='light'){h.removeAttribute('data-theme');localStorage.setItem('theme','dark');}else{h.setAttribute('data-theme','light');localStorage.setItem('theme','light');}}var nav=document.querySelector('nav')||document.querySelector('.nav-bar')||document.querySelector('.header')||document.querySelector('.topbar');if(nav){var btn=document.createElement('button');btn.innerHTML=document.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️';btn.style.cssText='background:none;border:none;cursor:pointer;font-size:18px;padding:2px 8px;margin-left:auto;line-height:1';btn.title='Alternar tema claro/escuro';btn.onclick=toggle;nav.appendChild(btn);}
})();
</script>
</body>
</html>
