<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomas Tech - Organizador de Tarefas</title>
    <style>
        :root {
            --kanban-bg: #0b0f14;
            --kanban-surface: #161b22;
            --kanban-card: #1c2333;
            --kanban-column: #1a1f2e;
            --kanban-text: #e1e7ef;
            --kanban-muted: #8b949e;
            --kanban-border: #21262d;
            --kanban-accent: #06b6d4;
        }
        [data-theme="light"] { --kanban-bg: #f4f5f7; --kanban-surface: #ffffff; --kanban-card: #ffffff; --kanban-column: #ebecf0; --kanban-text: #172b4d; --kanban-muted: #5e6c84; --kanban-border: #dfe1e6; --kanban-accent: #0052cc; }
        [data-theme="light"] .nav-bar { background: rgba(255,255,255,0.95) !important; border-color: #d1d5db !important; }
        [data-theme="light"] .nav-bar span, [data-theme="light"] .nav-bar a { color: #6b7280 !important; }
        [data-theme="light"] .nav-bar .title { color: #1a1a2e !important; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--kanban-bg); padding: 20px; color: var(--kanban-text); min-height: 100vh; margin: 0; }

        header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 24px; color: var(--kanban-text); }

        .btn-add {
            background-color: var(--kanban-accent); color: white; border: none; padding: 10px 20px;
            border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s;
        }
        .btn-add:hover { opacity: 0.85; }

        .kanban-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }

        .column {
            background-color: var(--kanban-column); border-radius: 8px; padding: 15px;
            min-height: 500px; border: 1px solid var(--kanban-border);
        }
        .column h2 {
            font-size: 16px; margin-bottom: 15px; color: var(--kanban-muted);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .task-list { min-height: 450px; display: flex; flex-direction: column; gap: 10px; }

        .task-card {
            background-color: var(--kanban-card); padding: 15px; border-radius: 6px;
            border: 1px solid var(--kanban-border); cursor: grab; user-select: none;
            position: relative; transition: transform 0.1s, box-shadow 0.1s;
        }
        .task-card:active { cursor: grabbing; }
        .task-card.dragging { opacity: 0.5; transform: scale(0.98); }

        .task-text { font-size: 15px; margin-bottom: 15px; word-break: break-word; line-height: 1.4; }
        .task-actions { display: flex; justify-content: flex-end; gap: 8px; }

        .btn-action { border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: 600; }
        .btn-edit { background-color: rgba(6,182,212,0.15); color: var(--kanban-accent); }
        .btn-edit:hover { background-color: rgba(6,182,212,0.25); }
        .btn-delete { background-color: rgba(239,68,68,0.15); color: #ef4444; }
        .btn-delete:hover { background-color: rgba(239,68,68,0.25); }

        @media (max-width: 768px) {
            .kanban-board { grid-template-columns: 1fr; }
            .column { min-height: auto; }
        }
    </style>
</head>
<body>

    <div class="nav-bar" style="height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(22,27,34,0.95);border-bottom:1px solid #21262d;">
        <div style="display:flex;align-items:center;gap:16px;">
            <a href="index.html" style="display:flex;align-items:center;gap:4px;color:#484f58;text-decoration:none;transition:color 0.2s;flex-shrink:0;white-space:nowrap" onmouseover="this.style.color='#06b6d4'" onmouseout="this.style.color='#484f58'">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span style="font-size:10px;font-weight:700;letter-spacing:.05em;color:#06b6d4;margin-left:4px">← VOLTAR</span>
            </a>
            <span style="width:1px;height:20px;background:#21262d;flex-shrink:0"></span>
            <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#484f58;flex-shrink:0">Módulo 20</span>
            <span style="width:1px;height:20px;background:#21262d;flex-shrink:0"></span>
            <span class="title" style="font-size:14px;font-weight:700;color:#e1e7ef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">Organizador de Tarefas</span>
        </div>
        <span style="font-size:10px;font-weight:700;color:#484f58;flex-shrink:0">Thomas Tech</span>
    </div>

    <header>
        <h1>Organizador de Tarefas</h1>
        <button class="btn-add" onclick="createTask()">+ Nova Tarefa</button>
    </header>

    <div class="kanban-board">
        <div class="column" data-status="nova">
            <h2>Nova</h2>
            <div class="task-list" id="col-nova"></div>
        </div>
        <div class="column" data-status="executando">
            <h2>Executando</h2>
            <div class="task-list" id="col-executando"></div>
        </div>
        <div class="column" data-status="finalizada">
            <h2>Finalizada</h2>
            <div class="task-list" id="col-finalizada"></div>
        </div>
    </div>

    <script>
        const columns = document.querySelectorAll('.task-list');

        function createTask() {
            const taskContent = prompt("Digite a descrição da nova tarefa:");
            if (taskContent && taskContent.trim() !== "") {
                const taskCard = generateTaskElement(taskContent.trim());
                document.getElementById('col-nova').appendChild(taskCard);
            }
        }

        function generateTaskElement(text) {
            const card = document.createElement('div');
            card.classList.add('task-card');
            card.setAttribute('draggable', 'true');
            card.addEventListener('dragstart', () => card.classList.add('dragging'));
            card.addEventListener('dragend', () => card.classList.remove('dragging'));
            card.innerHTML = `
                <div class="task-text">${text}</div>
                <div class="task-actions">
                    <button class="btn-action btn-edit" onclick="editTask(this)">Editar</button>
                    <button class="btn-action btn-delete" onclick="deleteTask(this)">Excluir</button>
                </div>`;
            return card;
        }

        function editTask(button) {
            const card = button.closest('.task-card');
            const textElement = card.querySelector('.task-text');
            const newText = prompt("Edite sua tarefa:", textElement.innerText);
            if (newText && newText.trim() !== "") textElement.innerText = newText.trim();
        }

        function deleteTask(button) {
            if (confirm("Tem certeza que deseja excluir esta tarefa?")) {
                button.closest('.task-card').remove();
            }
        }

        columns.forEach(column => {
            column.addEventListener('dragover', (e) => {
                e.preventDefault();
                const draggingCard = document.querySelector('.dragging');
                const afterElement = getDragAfterElement(column, e.clientY);
                if (afterElement == null) column.appendChild(draggingCard);
                else column.insertBefore(draggingCard, afterElement);
            });
        });

        function getDragAfterElement(column, y) {
            const draggableElements = [...column.querySelectorAll('.task-card:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) return { offset, element: child };
                return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }
    </script>
<script>
(function(){var t=localStorage.getItem('theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');function toggle(){var h=document.documentElement;if(h.getAttribute('data-theme')==='light'){h.removeAttribute('data-theme');localStorage.setItem('theme','dark');}else{h.setAttribute('data-theme','light');localStorage.setItem('theme','light');}}var nav=document.querySelector('nav')||document.querySelector('.nav-bar');if(nav){var btn=document.createElement('button');btn.innerHTML=document.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️';btn.style.cssText='background:none;border:none;cursor:pointer;font-size:18px;padding:2px 8px;margin-left:auto;line-height:1';btn.title='Alternar tema claro/escuro';btn.onclick=toggle;nav.appendChild(btn);}
})();
</script>
</body>
</html>
