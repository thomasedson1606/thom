<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Código de Barras - Thomas Tech</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        * { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f14; color: #e1e7ef; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .nav-bar { background: rgba(22,27,34,0.95); border-bottom: 1px solid #21262d; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; width: 100%; box-sizing: border-box; }
        .container { background: #12171f; border: 1px solid #222a35; border-radius: 12px; padding: 30px; margin: 40px auto; max-width: 420px; width: 90%; text-align: center; }
        h2 { color: #06b6d4; margin-bottom: 20px; font-size: 20px; }
        input[type="text"] { width: 100%; padding: 12px; background: #0b0f14; border: 1px solid #222a35; color: #e1e7ef; border-radius: 8px; font-size: 16px; box-sizing: border-box; transition: border-color .15s; }
        input[type="text"]:focus { border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6,182,212,.15); outline: none; }
        button { width: 100%; padding: 12px; font-size: 15px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 10px; transition: background .15s; }
        .btn-generate { background: #02727e; color: #fff; }
        .btn-generate:hover { background: #06b6d4; }
        .btn-print { background: #1a7f4a; color: #fff; display: none; }
        .btn-print:hover { background: #22c55e; }
        #barcode-container { margin-top: 25px; padding: 0; background: #fff; display: inline-block; width: 46mm; height: 35mm; overflow: hidden; border-radius: 4px; }
        #barcode { width: 46mm !important; height: 35mm !important; display: block; }
        .error-msg { color: #f87171; font-size: 14px; margin-top: 5px; display: none; }
        [data-theme="light"] body { background: #f4f5f7 !important; color: #172b4d !important; }
        [data-theme="light"] .nav-bar { background: rgba(255,255,255,0.95) !important; border-color: #d1d5db !important; }
        [data-theme="light"] .container { background: #ffffff !important; border-color: #dfe1e6 !important; }
        [data-theme="light"] h2 { color: #0052cc !important; }
        [data-theme="light"] input { background: #ffffff !important; border-color: #dfe1e6 !important; color: #172b4d !important; }
        [data-theme="light"] .btn-generate { background: #0052cc !important; }
        @media print {
            @page { size: A4 portrait; margin: 0; }
            html, body { background: #fff !important; margin: 0; padding: 0; }
            body * { visibility: hidden; }
            #barcode-container, #barcode-container * { visibility: visible; }
            #barcode-container { position: absolute; left: 20mm; top: 20mm; margin: 0; padding: 0; page-break-inside: avoid; }
            .nav-bar { display: none !important; }
        }
    </style>
</head>
<body>

<div class="nav-bar">
    <div style="display:flex;align-items:center;gap:16px;">
        <a href="index.html" style="display:flex;align-items:center;gap:4px;color:#484f58;text-decoration:none;transition:color 0.2s;white-space:nowrap" onmouseover="this.style.color='#06b6d4'" onmouseout="this.style.color='#484f58'">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span style="font-size:10px;font-weight:700;letter-spacing:.05em;color:#06b6d4;margin-left:4px">← VOLTAR</span>
        </a>
        <span style="width:1px;height:20px;background:#21262d;flex-shrink:0"></span>
        <span style="font-size:14px;font-weight:700;color:#e1e7ef">Gerador de Código de Barras</span>
    </div>
    <span style="font-size:10px;font-weight:700;color:#484f58">Thomas Tech</span>
</div>

<div class="container">
    <h2>Gerar Código de Barras</h2>
    <div style="margin-bottom:20px;">
        <input type="text" id="barcode-input" placeholder="Digite até 8 números" maxlength="8" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        <div id="error-message" class="error-msg">Por favor, insira pelo menos 1 número (máximo 8).</div>
    </div>
    <button class="btn-generate" onclick="generateBarcode()">GERAR CÓDIGO (Enter)</button>
    <button id="print-button" class="btn-print" onclick="window.print()">IMPRIMIR A4</button>
    <div id="barcode-container"><svg id="barcode"></svg></div>
</div>

<script>
    document.getElementById('barcode-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); generateBarcode(); }
    });
    function generateBarcode() {
        const input = document.getElementById('barcode-input').value.trim();
        const errorMsg = document.getElementById('error-message');
        const printBtn = document.getElementById('print-button');
        if (input.length === 0 || input.length > 8) {
            errorMsg.style.display = 'block'; printBtn.style.display = 'none';
            document.getElementById('barcode').innerHTML = ''; return;
        }
        errorMsg.style.display = 'none';
        try {
            JsBarcode("#barcode", input, { format: "CODE128", displayValue: false, margin: 0 });
            document.getElementById('barcode').setAttribute("preserveAspectRatio", "none");
            printBtn.style.display = 'block';
        } catch(e) {
            errorMsg.innerText = "Erro ao gerar o código."; errorMsg.style.display = 'block'; printBtn.style.display = 'none';
        }
    }
</script>

<script>
(function(){
    var t=localStorage.getItem('theme');
    if(t==='light')document.documentElement.setAttribute('data-theme','light');
    function toggle(){
        var h=document.documentElement;
        if(h.getAttribute('data-theme')==='light'){h.removeAttribute('data-theme');localStorage.setItem('theme','dark');}
        else{h.setAttribute('data-theme','light');localStorage.setItem('theme','light');}
    }
    var nav=document.querySelector('.nav-bar');
    if(nav){
        var btn=document.createElement('button');
        btn.innerHTML=document.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️';
        btn.style.cssText='background:none;border:none;cursor:pointer;font-size:18px;padding:2px 8px;margin-left:auto;line-height:1;color:#484f58';
        btn.title='Alternar tema';
        btn.onclick=toggle;
        nav.appendChild(btn);
    }
})();
</script>
</body>
</html>
