<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conciliação SEFAZ - Thomas Tech</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0b0f14; color: #e1e7ef; }
        .nav-bar { background: rgba(22, 27, 34, 0.95); border-bottom: 1px solid #21262d; }
        .glass-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
        .linha-sucesso { background: rgba(34, 197, 94, 0.08) !important; border-left: 8px solid #22c55e; }
        .linha-erro { background: rgba(239, 68, 68, 0.08) !important; border-left: 8px solid #ef4444; }
        .btn-filtro { transition: all 0.2s; border: 1px solid rgba(255,255,255,0.06); cursor: pointer; }
        .btn-filtro:hover { transform: translateY(-2px); }
        .btn-filtro.ativo { border-color: #06b6d4; box-shadow: 0 4px 6px -1px rgba(6, 182, 212, 0.2); scale: 1.05; }
        .status-badge { padding: 2px 8px; border-radius: 99px; font-size: 9px; font-weight: 900; border: 1px solid currentColor; }
        input[type="file"]::file-selector-button { background: #02727e; color: white; padding: 8px 16px; border: none; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
        input[type="file"]::file-selector-button:hover { background: #06b6d4; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0b0f14; } ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 3px; }
    </style>
</head>
<body class="font-sans min-h-screen">

    <nav class="nav-bar px-4 md:px-8 py-3 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="index.html" class="flex items-center gap-2 text-[#484f58] hover:text-[#06b6d4] transition-colors" style="flex-shrink:0;white-space:nowrap">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span class="text-[10px] font-bold tracking-wider" style="color:#06b6d4">← VOLTAR</span>
            </a>
            <span class="w-px h-5 bg-[#21262d]" style="flex-shrink:0"></span>
            <span class="text-xs font-bold text-[#484f58] uppercase" style="flex-shrink:0">Módulo 4</span>
            <span class="w-px h-5 bg-[#21262d]" style="flex-shrink:0"></span>
            <span class="text-sm font-bold text-[#e1e7ef]" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">Conciliação SEFAZ x Sistema</span>
        </div>
        <span class="text-[10px] font-bold text-[#484f58]">Thomas Tech</span>
    </nav>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="glass-card rounded-xl p-6 mb-8" style="border-top: 6px solid #06b6d4;">
            <h1 class="text-xl font-black text-[#e1e7ef] uppercase tracking-tighter mb-6">Conciliação N2: Filtros de Auditoria</h1>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <div class="p-6 rounded-xl" style="background: rgba(22,27,34,0.6); border: 1px solid #21262d;">
                    <label class="block font-black uppercase text-[10px] mb-3 text-[#06b6d4]">📂 Base SEFAZ (Número + Série)</label>
                    <input type="file" id="fileSefaz" accept=".xlsx, .xls, .csv" class="w-full text-xs">
                    <div id="detalheSefaz" class="mt-4 p-2 rounded text-[9px] font-bold text-[#484f58] uppercase italic" style="background: rgba(11,15,20,0.5);">Aguardando arquivo...</div>
                </div>
                <div class="p-6 rounded-xl" style="background: rgba(22,27,34,0.6); border: 1px solid #21262d;">
                    <label class="block font-black uppercase text-[10px] mb-3 text-[#4ade80]">📂 Base SISTEMA (Nota + Série)</label>
                    <input type="file" id="fileSistema" accept=".xlsx, .xls, .csv" class="w-full text-xs">
                    <div id="detalheSistema" class="mt-4 p-2 rounded text-[9px] font-bold text-[#484f58] uppercase italic" style="background: rgba(11,15,20,0.5);">Aguardando arquivo...</div>
                </div>
            </div>

            <div class="flex justify-center mb-8">
                <button onclick="executarComparativo()" class="px-16 py-4 rounded-2xl font-black text-lg uppercase tracking-wider shadow-2xl transition-all active:scale-95 cursor-pointer" style="background: linear-gradient(135deg, #02727e, #06b6d4); color: white;">
                    Executar Conciliação
                </button>
            </div>

            <div id="areaFiltros" class="hidden mb-6 flex flex-wrap justify-center gap-3">
                <button onclick="filtrar('TODOS')" class="btn-filtro ativo px-6 py-2 rounded-lg font-black text-[10px] uppercase" style="background: rgba(6,182,212,0.15); color: #06b6d4; border-color: rgba(6,182,212,0.3);" id="btn-TODOS">Todos (<span id="c-todos">0</span>)</button>
                <button onclick="filtrar('CONCILIADO OK')" class="btn-filtro px-6 py-2 rounded-lg font-black text-[10px] uppercase" style="background: rgba(34,197,94,0.1); color: #4ade80;" id="btn-OK">OK (<span id="c-ok">0</span>)</button>
                <button onclick="filtrar('DIVERGÊNCIA DE VALOR')" class="btn-filtro px-6 py-2 rounded-lg font-black text-[10px] uppercase" style="background: rgba(250,204,21,0.1); color: #facc15;" id="btn-DIF">Divergência R$ (<span id="c-dif">0</span>)</button>
                <button onclick="filtrar('FALTA NO SISTEMA')" class="btn-filtro px-6 py-2 rounded-lg font-black text-[10px] uppercase" style="background: rgba(239,68,68,0.1); color: #f87171;" id="btn-FSIST">Falta no Sistema (<span id="c-fsist">0</span>)</button>
                <button onclick="filtrar('FALTA NA SEFAZ')" class="btn-filtro px-6 py-2 rounded-lg font-black text-[10px] uppercase" style="background: rgba(251,146,60,0.1); color: #fb923c;" id="btn-FSEFAZ">Falta na SEFAZ (<span id="c-fsefaz">0</span>)</button>
            </div>

            <div id="containerTabela" class="hidden rounded-2xl overflow-hidden border border-[#21262d]">
                <table class="w-full text-left border-collapse">
                    <thead class="text-[10px] font-black uppercase tracking-widest" style="background: #161b22; color: #e1e7ef;">
                        <tr>
                            <th class="p-5">Identificação (Nota / Série)</th>
                            <th class="p-5">Vlr. SEFAZ</th>
                            <th class="p-5">Vlr. Sistema</th>
                            <th class="p-5">Diferença</th>
                            <th class="p-5">Status Final</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela" class="text-[11px] font-bold"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let baseSefaz = [];
        let baseSistema = [];
        let resultadosCompletos = [];

        document.getElementById('fileSefaz').addEventListener('change', (e) => lerBase(e, 'Sefaz'));
        document.getElementById('fileSistema').addEventListener('change', (e) => lerBase(e, 'Sistema'));

        function lerBase(event, tipo) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                if (!json.length) return;
                const colunas = Object.keys(json[0]);
                const colNota = colunas.find(c => ["NUMERO NOTA FISCAL", "NOTA", "NÚMERO"].includes(c.toUpperCase())) || colunas.find(c => c.toUpperCase().includes("NOTA"));
                const colSerie = colunas.find(c => ["SERIE", "SÉRIE"].includes(c.toUpperCase()));
                const colVlr = colunas.find(c => c.toUpperCase().includes("VALOR")) || colunas.find(c => c.toUpperCase().includes("TOTAL"));
                const normalizados = json.map(item => {
                    const n = item[colNota]?.toString().trim() || "0";
                    const s = item[colSerie]?.toString().trim() || "0";
                    return { chaveComposta: `N:${n}|S:${s}`, nota: n, serie: s, v: parseFloat(item[colVlr] || 0) };
                });
                if (tipo === 'Sefaz') {
                    baseSefaz = normalizados;
                    document.getElementById('detalheSefaz').innerText = `Capturado: ${colNota} + ${colSerie || 'S/Série'}`;
                } else {
                    baseSistema = normalizados;
                    document.getElementById('detalheSistema').innerText = `Capturado: ${colNota} + ${colSerie || 'S/Série'}`;
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function executarComparativo() {
            if (!baseSefaz.length || !baseSistema.length) return alert("Importe as duas bases primeiro.");
            const mapaSist = new Map(baseSistema.map(i => [i.chaveComposta, i.v]));
            const idsProcessados = new Set();
            resultadosCompletos = [];
            baseSefaz.forEach(item => {
                const vSist = mapaSist.get(item.chaveComposta);
                idsProcessados.add(item.chaveComposta);
                const dif = (vSist || 0) - item.v;
                let status = '', classe = '';
                if (vSist === undefined) { status = 'FALTA NO SISTEMA'; classe = 'linha-erro'; }
                else if (Math.abs(dif) > 0.01) { status = 'DIVERGÊNCIA DE VALOR'; classe = 'linha-erro'; }
                else { status = 'CONCILIADO OK'; classe = 'linha-sucesso'; }
                resultadosCompletos.push({ ...item, vSist: vSist || 0, dif, status, classe });
            });
            baseSistema.forEach(item => {
                if (!idsProcessados.has(item.chaveComposta)) {
                    resultadosCompletos.push({ ...item, vSist: item.v, v: 0, dif: item.v, status: 'FALTA NA SEFAZ', classe: 'linha-erro' });
                }
            });
            atualizarContadores();
            document.getElementById('areaFiltros').classList.remove('hidden');
            document.getElementById('containerTabela').classList.remove('hidden');
            renderizar(resultadosCompletos);
        }

        function atualizarContadores() {
            document.getElementById('c-todos').innerText = resultadosCompletos.length;
            document.getElementById('c-ok').innerText = resultadosCompletos.filter(i => i.status === 'CONCILIADO OK').length;
            document.getElementById('c-dif').innerText = resultadosCompletos.filter(i => i.status === 'DIVERGÊNCIA DE VALOR').length;
            document.getElementById('c-fsist').innerText = resultadosCompletos.filter(i => i.status === 'FALTA NO SISTEMA').length;
            document.getElementById('c-fsefaz').innerText = resultadosCompletos.filter(i => i.status === 'FALTA NA SEFAZ').length;
        }

        function filtrar(status) {
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('ativo'));
            const map = { TODOS: 'btn-TODOS', 'CONCILIADO OK': 'btn-OK', 'DIVERGÊNCIA DE VALOR': 'btn-DIF', 'FALTA NO SISTEMA': 'btn-FSIST', 'FALTA NA SEFAZ': 'btn-FSEFAZ' };
            const btn = document.getElementById(map[status]);
            if (btn) btn.classList.add('ativo');
            const filtrados = status === 'TODOS' ? resultadosCompletos : resultadosCompletos.filter(i => i.status === status);
            renderizar(filtrados);
        }

        function renderizar(lista) {
            const tbody = document.getElementById('corpoTabela');
            tbody.innerHTML = lista.map(item => `
                <tr class="${item.classe} border-b border-[#21262d]">
                    <td class="p-5"><div class="text-[#e1e7ef] font-black">NFCe: ${item.nota}</div><div class="text-[9px] text-[#484f58] uppercase font-bold">Série: ${item.serie}</div></td>
                    <td class="p-5 text-[#e1e7ef]">R$ ${item.v.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
                    <td class="p-5 text-[#e1e7ef]">R$ ${item.vSist.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
                    <td class="p-5 font-bold ${Math.abs(item.dif) > 0.01 ? 'text-red-400' : 'text-[#484f58]'}">R$ ${item.dif.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
                    <td class="p-5 uppercase italic"><span class="status-badge" style="color: ${item.status === 'CONCILIADO OK' ? '#4ade80' : '#f87171'}">${item.status}</span></td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
