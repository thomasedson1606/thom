<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomas Tech - Manual de Rejeições NF-e</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #0b0f14;
            --text-primary: #e1e7ef;
            --text-secondary: #8b949e;
            --border-color: rgba(255,255,255,0.08);
        }
        [data-theme="light"] { --bg-primary: #f5f7fa; --text-primary: #1f2937; --text-secondary: #6b7280; --border-color: rgba(0,0,0,0.08); }
        [data-theme="light"] .nav-bar { background: rgba(255,255,255,0.95) !important; border-color: #d1d5db !important; }
        [data-theme="light"] .nav-bar span, [data-theme="light"] .nav-bar a { color: #6b7280 !important; }
        [data-theme="light"] .nav-bar .title { color: #1a1a2e !important; }
        [data-theme="light"] .rejeicoes-content { background: linear-gradient(145deg, rgba(255,255,255,0.9) 0%, rgba(240,240,245,0.8) 100%); border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 10px 40px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.8); }
        [data-theme="light"] .search-input { background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.1); }
        [data-theme="light"] .rejeicao-card { background: rgba(255,255,255,0.7); border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        [data-theme="light"] .rejeicao-card:hover { background: rgba(255,255,255,1); border-color: rgba(168,85,247,0.4); }
        [data-theme="light"] .rejeicao-codigo { color: #9333ea; background: rgba(168,85,247,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .rejeicoes-container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 32px 24px; position: relative; z-index: 10; display: flex; flex-direction: column; gap: 24px; min-height: 85vh; }
        .rejeicoes-header { display: flex; justify-content: space-between; align-items: center; }
        .rejeicoes-header h1 { display: flex; align-items: center; gap: 12px; font-size: 2rem; font-weight: 800; color: var(--text-primary); margin: 0; }
        .rejeicoes-icon { color: #a855f7; }
        .rejeicoes-content { background: linear-gradient(145deg, rgba(30,30,36,0.7) 0%, rgba(20,20,25,0.6) 100%); border: 1px solid var(--border-color); border-radius: 24px; padding: 32px; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 10px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 24px; }
        .search-bar-container { display: flex; flex-direction: column; gap: 12px; }
        .search-input-wrapper { position: relative; width: 100%; }
        .search-icon-inside { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
        .search-input { width: 100%; padding: 16px 20px 16px 52px; font-size: 1.1rem; font-weight: 600; color: var(--text-primary); background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 16px; transition: all 0.3s; outline: none; }
        .search-input:focus { border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168,85,247,0.2); }
        .results-count { font-size: 0.9rem; color: var(--text-secondary); text-align: right; font-weight: 600; }
        .rejeicoes-list { display: flex; flex-direction: column; gap: 16px; max-height: 60vh; overflow-y: auto; padding-right: 12px; }
        .rejeicoes-list::-webkit-scrollbar { width: 8px; }
        .rejeicoes-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        .rejeicoes-list::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.5); border-radius: 4px; }
        .rejeicoes-list::-webkit-scrollbar-thumb:hover { background: rgba(168,85,247,0.8); }
        .no-results { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 48px; color: var(--text-secondary); text-align: center; }
        .rejeicao-card { display: flex; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px 20px; gap: 20px; transition: all 0.2s; }
        .rejeicao-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(168,85,247,0.4); transform: translateX(4px); }
        .rejeicao-codigo { display: flex; align-items: center; justify-content: center; background: rgba(168,85,247,0.15); color: #c084fc; font-weight: 800; font-size: 1.1rem; padding: 8px 16px; border-radius: 8px; min-width: 100px; text-align: center; border: 1px solid rgba(168,85,247,0.3); }
        .rejeicao-texto { flex: 1; font-size: 1rem; color: var(--text-primary); font-weight: 500; line-height: 1.4; }
        .rejeicao-actions { display: flex; align-items: center; }
        .btn-solucao { display: flex; align-items: center; gap: 8px; background: transparent; color: #3b82f6; border: 1px solid #3b82f6; padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .btn-solucao:hover { background: rgba(59,130,246,0.1); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(59,130,246,0.2); }

        @media (max-width: 768px) {
            .rejeicao-card { flex-direction: column; align-items: flex-start; gap: 12px; }
            .rejeicao-codigo { width: 100%; justify-content: flex-start; }
            .btn-solucao { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="nav-bar" style="height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(22,27,34,0.95);border-bottom:1px solid #21262d;">
        <div style="display:flex;align-items:center;gap:16px;">
            <a href="index.html" style="display:flex;align-items:center;gap:4px;color:#484f58;text-decoration:none;transition:color 0.2s;flex-shrink:0;white-space:nowrap" onmouseover="this.style.color='#06b6d4'" onmouseout="this.style.color='#484f58'">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span style="font-size:10px;font-weight:700;letter-spacing:.05em;color:#06b6d4;margin-left:4px">← VOLTAR</span>
            </a>
            <span style="width:1px;height:20px;background:#21262d;flex-shrink:0"></span>
            <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#484f58;flex-shrink:0">Módulo 19</span>
            <span style="width:1px;height:20px;background:#21262d;flex-shrink:0"></span>
            <span class="title" style="font-size:14px;font-weight:700;color:#e1e7ef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">Manual de Rejeições NF-e</span>
        </div>
        <span style="font-size:10px;font-weight:700;color:#484f58;flex-shrink:0">Thomas Tech</span>
    </div>

    <div class="rejeicoes-container">
        <div class="rejeicoes-header">
            <h1>
                <i data-lucide="book-open" class="rejeicoes-icon" style="width:32px;height:32px;"></i>
                Manual de Rejeições NF-e
            </h1>
        </div>

        <div class="rejeicoes-content">
            <div class="search-bar-container">
                <div class="search-input-wrapper">
                    <i data-lucide="search" class="search-icon-inside" style="width:20px;height:20px;"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar por código (ex: 204) ou texto...">
                </div>
                <div class="results-count" id="resultsCount">0 resultados</div>
            </div>

            <div class="rejeicoes-list" id="rejeicoesList"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const rejeicoesDados = [
            { codigo: "106", resultado: "Rejeição: Lote não localizado", linkSolucao: "https://atendimento.tecnospeed.com.br/hc/pt-br/articles/4421365750167-Lista-de-Rejei%C3%A7%C3%B5es-NF-e" },
            { codigo: "108", resultado: "Rejeição: Serviço paralisado momentaneamente", linkSolucao: "https://atendimento.tecnospeed.com.br/hc/pt-br/articles/4421365750167-Lista-de-Rejei%C3%A7%C3%B5es-NF-e" },
            { codigo: "204", resultado: "Rejeição: Duplicidade de NF-e", linkSolucao: "https://atendimento.tecnospeed.com.br/hc/pt-br/articles/4421365750167-Lista-de-Rejei%C3%A7%C3%B5es-NF-e" },
            { codigo: "210", resultado: "Rejeição: IE do destinatário inválida", linkSolucao: "https://atendimento.tecnospeed.com.br/hc/pt-br/articles/4421365750167-Lista-de-Rejei%C3%A7%C3%B5es-NF-e" },
            { codigo: "225", resultado: "Rejeição: Falha no Schema XML do lote de NFe", linkSolucao: "https://atendimento.tecnospeed.com.br/hc/pt-br/articles/4421365750167-Lista-de-Rejei%C3%A7%C3%B5es-NF-e" },
            { codigo: "321", resultado: "Rejeição: NF-e de devolução de mercadoria não possui documento fiscal referenciado", linkSolucao: "https://atendimento.tecnospeed.com.br/hc/pt-br/articles/4421365750167-Lista-de-Rejei%C3%A7%C3%B5es-NF-e" }
        ];

        const listEl = document.getElementById('rejeicoesList');
        const searchInput = document.getElementById('searchInput');
        const resultsCount = document.getElementById('resultsCount');

        function render(list) {
            listEl.innerHTML = '';
            resultsCount.textContent = `${list.length} ${list.length === 1 ? 'resultado' : 'resultados'}`;

            if (list.length === 0) {
                listEl.innerHTML = `
                    <div class="no-results">
                        <i data-lucide="alert-triangle" style="width:48px;height:48px;opacity:0.5;"></i>
                        <p>Nenhuma rejeição encontrada para "${searchInput.value}".</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            list.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'rejeicao-card';
                card.style.animation = `fadeIn 0.3s ease ${idx * 0.03}s both`;
                card.innerHTML = `
                    <div class="rejeicao-codigo"><span>Cód. ${item.codigo}</span></div>
                    <div class="rejeicao-texto">${item.resultado}</div>
                    <div class="rejeicao-actions">
                        <a href="${item.linkSolucao}" target="_blank" rel="noopener noreferrer" class="btn-solucao" title="Ver solução detalhada na TecnoSpeed">
                            <i data-lucide="external-link" style="width:16px;height:16px;"></i> Ver Solução
                        </a>
                    </div>`;
                listEl.appendChild(card);
            });
            lucide.createIcons();
        }

        searchInput.addEventListener('input', () => {
            const term = searchInput.value.toLowerCase().trim();
            const filtered = rejeicoesDados.filter(d =>
                d.codigo.includes(term) || d.resultado.toLowerCase().includes(term)
            );
            render(filtered);
        });

        render(rejeicoesDados);
    </script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
<script>
(function(){var t=localStorage.getItem('theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');function toggle(){var h=document.documentElement;if(h.getAttribute('data-theme')==='light'){h.removeAttribute('data-theme');localStorage.setItem('theme','dark');}else{h.setAttribute('data-theme','light');localStorage.setItem('theme','light');}}var nav=document.querySelector('nav')||document.querySelector('.nav-bar');if(nav){var btn=document.createElement('button');btn.innerHTML=document.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️';btn.style.cssText='background:none;border:none;cursor:pointer;font-size:18px;padding:2px 8px;margin-left:auto;line-height:1';btn.title='Alternar tema claro/escuro';btn.onclick=toggle;nav.appendChild(btn);}
})();
</script>
</body>
</html>
