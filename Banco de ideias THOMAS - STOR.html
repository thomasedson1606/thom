<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Ideias (STOR Sistemas) - Thomas Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0b0f14; color: #e1e7ef; }
        .nav-bar { background: rgba(22, 27, 34, 0.95); border-bottom: 1px solid #21262d; }
        .app-nav { background: #12171f; border-bottom: 1px solid #222a35; }
        .app-content { background: #12171f; border: 1px solid #222a35; border-radius: 12px; }
        .input-field { background: #0b0f14; border: 1px solid #222a35; color: #e1e7ef; border-radius: 8px; }
        .input-field:focus { border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6,182,212,.15); outline: none; }
        .btn-primary { background: #02727e; color: #fff; font-weight: 700; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; transition: background .15s; }
        .btn-primary:hover { background: #06b6d4; }
        .btn-success { background: #1a7f4a; color: #fff; font-weight: 700; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; transition: background .15s; }
        .btn-success:hover { background: #22c55e; }
        .btn-cancel { background: #2a3340; color: #e1e7ef; font-weight: 700; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; transition: background .15s; }
        .btn-cancel:hover { background: #3b4658; }
        .btn-desk { background: #1f1335; color: #a78bfa; padding: 6px 12px; border-radius: 6px; border: 1px solid #3a2560; cursor: pointer; font-weight: 600; font-size: 12px; transition: background .15s; }
        .btn-desk:hover { background: #2f1f4a; }
        .btn-edit { background: #1a2a1a; color: #fbbf24; padding: 6px 12px; border-radius: 6px; border: 1px solid #3a4a1a; cursor: pointer; font-weight: 600; font-size: 12px; transition: background .15s; }
        .btn-edit:hover { background: #2a3a2a; }
        .btn-delete { background: #2a1a1a; color: #f87171; padding: 6px 12px; border-radius: 6px; border: 1px solid #4a2a2a; cursor: pointer; font-weight: 600; font-size: 12px; transition: background .15s; }
        .btn-delete:hover { background: #3a2a2a; }
        .badge-sistema { background: #062d3a; color: #06b6d4; font-size: 11px; padding: 3px 10px; border-radius: 6px; font-weight: 700; display: inline-block; }
        .badge-desk { background: #1f1335; color: #a78bfa; font-size: 11px; padding: 3px 10px; border-radius: 6px; font-family: monospace; }
        .badge-desk-empty { color: #6b7280; font-size: 11px; font-style: italic; padding: 3px 10px; }
        .modal-overlay { background: rgba(0,0,0,0.6); }
        .modal-box { background: #12171f; border: 1px solid #222a35; border-radius: 12px; }
        table { border-collapse: collapse; }
        th { color: #8b949e; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 12px 16px; text-align: left; }
        td { color: #e1e7ef; font-size: 13px; padding: 12px 16px; border-bottom: 1px solid #222a35; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .tab-btn { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: all .15s; color: #8b949e; background: transparent; }
        .tab-btn:hover { background: rgba(255,255,255,0.05); color: #e1e7ef; }
        .tab-btn.active { background: #1a2332; color: #06b6d4; box-shadow: 0 0 0 1px rgba(6,182,212,.3); }
        [data-theme="light"] { --bg: #f5f7fa; --surface: #ffffff; --border: #d1d5db; --text: #1a1a2e; --muted: #6b7280; --accent: #02727e; }
        [data-theme="light"] body { background: var(--bg) !important; color: var(--text) !important; }
        [data-theme="light"] .nav-bar { background: rgba(255,255,255,0.95) !important; border-color: var(--border) !important; }
        [data-theme="light"] .app-nav { background: var(--surface) !important; border-color: var(--border) !important; }
        [data-theme="light"] .app-content { background: var(--surface) !important; border-color: var(--border) !important; }
        [data-theme="light"] .modal-box { background: var(--surface) !important; border-color: var(--border) !important; }
        [data-theme="light"] .input-field { background: var(--surface) !important; border-color: var(--border) !important; color: var(--text) !important; }
        [data-theme="light"] th { color: var(--muted) !important; }
        [data-theme="light"] td { color: var(--text) !important; border-color: var(--border) !important; }
        [data-theme="light"] tr:hover td { background: rgba(0,0,0,0.02) !important; }
        [data-theme="light"] .tab-btn { color: var(--muted) !important; }
        [data-theme="light"] .tab-btn:hover { background: rgba(0,0,0,0.05) !important; color: var(--text) !important; }
        [data-theme="light"] .tab-btn.active { background: rgba(2,114,126,.1) !important; color: var(--accent) !important; box-shadow: 0 0 0 1px rgba(2,114,126,.2) !important; }
        [data-theme="light"] .btn-primary { background: var(--accent) !important; }
        [data-theme="light"] .badge-sistema { background: rgba(2,114,126,.1) !important; color: var(--accent) !important; }
        [data-theme="light"] .badge-desk { background: rgba(167,139,250,.1) !important; color: #7c3aed !important; }
        [data-theme="light"] .btn-desk { background: rgba(167,139,250,.08) !important; color: #7c3aed !important; border-color: rgba(167,139,250,.2) !important; }
        [data-theme="light"] .btn-edit { background: rgba(251,191,36,.08) !important; color: #d97706 !important; border-color: rgba(251,191,36,.2) !important; }
        [data-theme="light"] .btn-delete { background: rgba(248,113,113,.08) !important; color: #dc2626 !important; border-color: rgba(248,113,113,.2) !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f14; }
        ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 3px; }
    </style>
</head>
<body>

<div class="nav-bar" style="height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;">
    <div style="display:flex;align-items:center;gap:16px;">
        <a href="index.html" style="display:flex;align-items:center;gap:4px;color:#484f58;text-decoration:none;transition:color 0.2s;flex-shrink:0;white-space:nowrap" onmouseover="this.style.color='#06b6d4'" onmouseout="this.style.color='#484f58'">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span style="font-size:10px;font-weight:700;letter-spacing:.05em;color:#06b6d4;margin-left:4px">← VOLTAR</span>
        </a>
        <span style="width:1px;height:20px;background:#21262d;flex-shrink:0"></span>
        <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#484f58;flex-shrink:0">Módulo 23</span>
        <span style="width:1px;height:20px;background:#21262d;flex-shrink:0"></span>
        <span class="title" style="font-size:14px;font-weight:700;color:#e1e7ef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">Banco de Ideias (STOR Sistemas)</span>
    </div>
    <span style="font-size:10px;font-weight:700;color:#484f58;flex-shrink:0">Thomas Tech</span>
</div>

    <nav class="app-nav" style="margin-top:0;">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <span class="text-xl font-bold tracking-wide" style="color:#e1e7ef;">Banco de Ideias <span style="color:#06b6d4;">(STOR Sistemas)</span></span>
                <div class="flex space-x-2">
                    <button onclick="switchTab('parametros')" id="btn-parametros" class="tab-btn">Parâmetros</button>
                    <button onclick="switchTab('nova-ideia')" id="btn-nova-ideia" class="tab-btn">Nova Ideia</button>
                    <button onclick="switchTab('ideias')" id="btn-ideias" class="tab-btn active">Ideias</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-8 p-4">
        
        <section id="tab-parametros" class="tab-content hidden app-content p-6">
            <h2 style="font-size:22px;font-weight:800;margin-bottom:20px;padding-bottom:8px;border-bottom:1px solid #222a35;color:#e1e7ef;">Configuração de Parâmetros</h2>
            <form id="form-parametros" onsubmit="salvarParametro(event)" class="space-y-4 max-w-md">
                <div>
                    <label style="display:block;font-size:13px;font-weight:600;color:#c1c9d4;margin-bottom:6px;">Sistema</label>
                    <select id="param-sistema" class="input-field w-full p-3" required>
                        <option value="STOR">STOR</option>
                        <option value="STOR AGRO">STOR AGRO</option>
                    </select>
                </div>
                <div>
                    <label style="display:block;font-size:13px;font-weight:600;color:#c1c9d4;margin-bottom:6px;">Nome do Módulo</label>
                    <input type="text" id="param-modulo" class="input-field w-full p-3" placeholder="Ex: Financeiro, Estoque..." required>
                </div>
                <button type="submit" class="btn-primary">Cadastrar Módulo</button>
            </form>

            <div class="mt-8">
                <h3 style="font-size:16px;font-weight:700;margin-bottom:12px;color:#c1c9d4;">Módulos Cadastrados</h3>
                <div class="overflow-x-auto">
                    <table style="width:100%;border:1px solid #222a35;border-radius:8px;overflow:hidden;">
                        <thead style="background:#0d1219;">
                            <tr>
                                <th>Sistema</th>
                                <th>Módulo</th>
                                <th style="text-align:right;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-parametros">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="tab-nova-ideia" class="tab-content hidden app-content p-6">
            <h2 id="titulo-form-ideia" style="font-size:22px;font-weight:800;margin-bottom:20px;padding-bottom:8px;border-bottom:1px solid #222a35;color:#e1e7ef;">Adicionar Nova Ideia</h2>
            <form id="form-ideia" onsubmit="salvarIdeia(event)" class="space-y-4 max-w-2xl">
                <input type="hidden" id="ideia-id">
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">
                    <div>
                        <label style="display:block;font-size:13px;font-weight:600;color:#c1c9d4;margin-bottom:6px;">Data</label>
                        <input type="date" id="ideia-data" class="input-field w-full p-3" required>
                    </div>
                    <div>
                        <label style="display:block;font-size:13px;font-weight:600;color:#c1c9d4;margin-bottom:6px;">Sistema</label>
                        <select id="ideia-sistema" onchange="atualizarModulosDropdown()" class="input-field w-full p-3" required>
                            <option value="">Selecione...</option>
                            <option value="STOR">STOR</option>
                            <option value="STOR AGRO">STOR AGRO</option>
                        </select>
                    </div>
                    <div>
                        <label style="display:block;font-size:13px;font-weight:600;color:#c1c9d4;margin-bottom:6px;">Módulo</label>
                        <select id="ideia-modulo" class="input-field w-full p-3" required>
                            <option value="">Selecione o sistema primeiro...</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label style="display:block;font-size:13px;font-weight:600;color:#c1c9d4;margin-bottom:6px;">Título</label>
                    <input type="text" id="ideia-titulo" class="input-field w-full p-3" placeholder="Resumo da ideia" required>
                </div>
                <div>
                    <label style="display:block;font-size:13px;font-weight:600;color:#c1c9d4;margin-bottom:6px;">Ideia (Detalhes)</label>
                    <textarea id="ideia-texto" rows="6" class="input-field w-full p-3" placeholder="Descreva detalhadamente a sua ideia aqui..." required></textarea>
                </div>
                <div style="display:flex;gap:12px;">
                    <button type="submit" class="btn-success">SALVAR</button>
                    <button type="button" onclick="cancelarEdicao()" id="btn-cancelar-ideia" class="hidden btn-cancel">Cancelar</button>
                </div>
            </form>
        </section>

        <section id="tab-ideias" class="tab-content hidden app-content p-6">
            <h2 style="font-size:22px;font-weight:800;margin-bottom:20px;padding-bottom:8px;border-bottom:1px solid #222a35;color:#e1e7ef;">Relação de Ideias</h2>
            <div class="overflow-x-auto">
                <table style="width:100%;border:1px solid #222a35;border-radius:8px;overflow:hidden;">
                    <thead style="background:#0d1219;">
                        <tr>
                            <th>Data</th>
                            <th>Sistema/Módulo</th>
                            <th>Título/Ideia</th>
                            <th>Cód. DESK</th>
                            <th style="text-align:right;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-ideias">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modal-desk" class="fixed inset-0 modal-overlay hidden flex items-center justify-center p-4">
        <div class="modal-box max-w-sm w-full p-6">
            <h3 style="font-size:18px;font-weight:800;color:#e1e7ef;margin-bottom:16px;">Vincular Código DESK</h3>
            <input type="hidden" id="modal-ideia-id">
            <div class="mb-4">
                <label style="display:block;font-size:13px;font-weight:600;color:#c1c9d4;margin-bottom:6px;">Código DESK</label>
                <input type="text" id="modal-desk-codigo" class="input-field w-full p-3" placeholder="Ex: DSK-1234">
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px;">
                <button onclick="fecharModalDesk()" class="btn-cancel">Cancelar</button>
                <button onclick="salvarModalDesk()" class="btn-primary">Salvar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA_po9hvJqFPri_AI4uw73AiYb5BbspNjs",
            authDomain: "thomas-teste-d7a3d.firebaseapp.com",
            projectId: "thomas-teste-d7a3d",
            storageBucket: "thomas-teste-d7a3d.firebasestorage.app",
            messagingSenderId: "280109049625",
            appId: "1:280109049625:web:487874357d0173797d0788"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let parametros = [];
        let ideias = [];

        // Expor funções ao HTML (onclick, onsubmit, onchange)
        window.parametros = parametros;
        window.ideias = ideias;
        window.switchTab = switchTab;
        window.salvarParametro = salvarParametro;
        window.excluirParametro = excluirParametro;
        window.salvarIdeia = salvarIdeia;
        window.editarIdeia = editarIdeia;
        window.excluirIdeia = excluirIdeia;
        window.cancelarEdicao = cancelarEdicao;
        window.atualizarModulosDropdown = atualizarModulosDropdown;
        window.abrirModalDesk = abrirModalDesk;
        window.fecharModalDesk = fecharModalDesk;
        window.salvarModalDesk = salvarModalDesk;

        // Inicialização do sistema ao carregar a página
        definirDataAtual();
        switchTab('ideias');
        renderizarParametros();
        renderizarIdeias();

        // Listeners em tempo real
        onSnapshot(collection(db, "banco_ideias_parametros"), (snapshot) => {
            parametros = [];
            snapshot.forEach(d => { let item = d.data(); item.firebaseId = d.id; parametros.push(item); });
            window.parametros = parametros;
            renderizarParametros();
            atualizarModulosDropdown();
        });

        onSnapshot(collection(db, "banco_ideias_ideias"), (snapshot) => {
            ideias = [];
            snapshot.forEach(d => { let item = d.data(); item.firebaseId = d.id; ideias.push(item); });
            window.ideias = ideias;
            renderizarIdeias();
        });

        // Sistema de abas (Tabs)
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');

            // Resetar estilos dos botões do menu
            ['parametros', 'nova-ideia', 'ideias'].forEach(id => {
                const btn = document.getElementById('btn-' + id);
                if (id === tabId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (tabId === 'nova-ideia' && !document.getElementById('ideia-id').value) {
                definirDataAtual();
            }
            atualizarModulosDropdown();
        }

        function definirDataAtual() {
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('ideia-data').value = hoje;
        }

        // ==========================================
        // LÓGICA DE PARÂMETROS
        // ==========================================
        async function salvarParametro(e) {
            e.preventDefault();
            const sistema = document.getElementById('param-sistema').value;
            const modulo = document.getElementById('param-modulo').value.trim();

            const existe = parametros.some(p => p.sistema === sistema && p.modulo.toLowerCase() === modulo.toLowerCase());
            if (existe) {
                alert('Este módulo já está cadastrado para este sistema!');
                return;
            }

            try {
                await addDoc(collection(db, "banco_ideias_parametros"), { sistema, modulo });
                document.getElementById('param-modulo').value = '';
            } catch(e) {
                alert('Erro ao cadastrar: ' + e);
            }
        }

        async function excluirParametro(firebaseId) {
            if (confirm('Deseja realmente excluir este parâmetro?')) {
                try {
                    await deleteDoc(doc(db, "banco_ideias_parametros", firebaseId));
                } catch(e) {
                    alert('Erro ao excluir: ' + e);
                }
            }
        }

        function renderizarParametros() {
            const corpoTabela = document.getElementById('lista-parametros');
            corpoTabela.innerHTML = '';

            if (parametros.length === 0) {
                corpoTabela.innerHTML = `<tr><td colspan="3" style="text-align:center;color:#8b949e;padding:24px;font-size:13px;">Nenhum módulo cadastrado.</td></tr>`;
                return;
            }

            parametros.forEach(p => {
                corpoTabela.innerHTML += `
                    <tr>
                        <td style="font-weight:700;">${p.sistema}</td>
                        <td style="color:#8b949e;">${p.modulo}</td>
                        <td style="text-align:right;">
                            <button onclick="excluirParametro('${p.firebaseId}')" class="btn-delete">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        function atualizarModulosDropdown() {
            const sistemaSelecionado = document.getElementById('ideia-sistema').value;
            const comboModulo = document.getElementById('ideia-modulo');
            comboModulo.innerHTML = '<option value="">Selecione...</option>';

            const filtrados = parametros.filter(p => p.sistema === sistemaSelecionado);
            
            if (filtrados.length === 0 && sistemaSelecionado !== "") {
                comboModulo.innerHTML = '<option value="">Nenhum módulo cadastrado para este sistema</option>';
            } else {
                filtrados.forEach(p => {
                    comboModulo.innerHTML += `<option value="${p.modulo}">${p.modulo}</option>`;
                });
            }
        }

        // ==========================================
        // LÓGICA DE IDEIAS
        // ==========================================
        async function salvarIdeia(e) {
            e.preventDefault();
            const firebaseId = document.getElementById('ideia-id').value;
            const data = document.getElementById('ideia-data').value;
            const sistema = document.getElementById('ideia-sistema').value;
            const modulo = document.getElementById('ideia-modulo').value;
            const titulo = document.getElementById('ideia-titulo').value.trim();
            const texto = document.getElementById('ideia-texto').value.trim();

            try {
                if (firebaseId) {
                    await updateDoc(doc(db, "banco_ideias_ideias", firebaseId), { data, sistema, modulo, titulo, texto });
                } else {
                    await addDoc(collection(db, "banco_ideias_ideias"), { data, sistema, modulo, titulo, texto, desk: '' });
                }
                cancelarEdicao();
                switchTab('ideias');
            } catch(e) {
                alert('Erro ao salvar: ' + e);
            }
        }

        function editarIdeia(firebaseId) {
            const ideia = ideias.find(i => i.firebaseId === firebaseId);
            if (!ideia) return;

            document.getElementById('titulo-form-ideia').innerText = "Editar Ideia";
            document.getElementById('ideia-id').value = ideia.firebaseId;
            document.getElementById('ideia-data').value = ideia.data;
            document.getElementById('ideia-sistema').value = ideia.sistema;
            
            atualizarModulosDropdown();
            document.getElementById('ideia-modulo').value = ideia.modulo;
            
            document.getElementById('ideia-titulo').value = ideia.titulo;
            document.getElementById('ideia-texto').value = ideia.texto;

            document.getElementById('btn-cancelar-ideia').classList.remove('hidden');
            switchTab('nova-ideia');
        }

        function cancelarEdicao() {
            document.getElementById('titulo-form-ideia').innerText = "Adicionar Nova Ideia";
            document.getElementById('form-ideia').reset();
            document.getElementById('ideia-id').value = '';
            document.getElementById('btn-cancelar-ideia').classList.add('hidden');
            definirDataAtual();
        }

        async function excluirIdeia(firebaseId) {
            if (confirm('Deseja realmente apagar esta ideia?')) {
                try {
                    await deleteDoc(doc(db, "banco_ideias_ideias", firebaseId));
                } catch(e) {
                    alert('Erro ao excluir: ' + e);
                }
            }
        }

        function formatarDataBR(dataString) {
            if(!dataString) return "";
            const [ano, mes, dia] = dataString.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        function renderizarIdeias() {
            const lista = document.getElementById('lista-ideias');
            lista.innerHTML = '';

            if (ideias.length === 0) {
                lista.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#8b949e;padding:24px;font-size:13px;">Nenhuma ideia registrada ainda.</td></tr>`;
                return;
            }

            const ideiasOrdenadas = [...ideias].sort((a,b) => new Date(b.data) - new Date(a.data));

            ideiasOrdenadas.forEach(i => {
                lista.innerHTML += `
                    <tr>
                        <td style="color:#8b949e;white-space:nowrap;">${formatarDataBR(i.data)}</td>
                        <td style="white-space:nowrap;">
                            <span class="badge-sistema">${i.sistema}</span><br>
                            <span style="color:#6b7280;font-size:12px;">${i.modulo}</span>
                        </td>
                        <td style="max-width:280px;">
                            <div style="font-weight:700;">${i.titulo}</div>
                            <div style="color:#8b949e;font-size:12px;margin-top:4px;white-space:pre-line;">${i.texto}</div>
                        </td>
                        <td>
                            <span class="${i.desk ? 'badge-desk' : 'badge-desk-empty'}">
                                ${i.desk || 'Nenhum'}
                            </span>
                        </td>
                        <td style="text-align:right;white-space:nowrap;">
                            <button onclick="abrirModalDesk('${i.firebaseId}', '${i.desk || ''}')" class="btn-desk">DESK</button>
                            <button onclick="editarIdeia('${i.firebaseId}')" class="btn-edit">Editar</button>
                            <button onclick="excluirIdeia('${i.firebaseId}')" class="btn-delete">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        // ==========================================
        // LÓGICA DO JANELA (MODAL) DESK
        // ==========================================
        function abrirModalDesk(firebaseId, codigoAtual) {
            document.getElementById('modal-ideia-id').value = firebaseId;
            document.getElementById('modal-desk-codigo').value = codigoAtual === 'undefined' || codigoAtual === 'null' ? '' : codigoAtual;
            document.getElementById('modal-desk').classList.remove('hidden');
        }

        function fecharModalDesk() {
            document.getElementById('modal-desk').classList.add('hidden');
        }

        async function salvarModalDesk() {
            const firebaseId = document.getElementById('modal-ideia-id').value;
            const codigo = document.getElementById('modal-desk-codigo').value.trim();

            try {
                await updateDoc(doc(db, "banco_ideias_ideias", firebaseId), { desk: codigo });
                fecharModalDesk();
            } catch(e) {
                alert('Erro ao salvar código DESK: ' + e);
            }
        }
    </script>
</body>
</html>
