<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador QR Code - Thomas Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0b0f14; min-height: 100vh; }
        .nav-bar { background: rgba(22, 27, 34, 0.95); border-bottom: 1px solid #21262d; }
        .glass-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); }
        #qrcode img, #qrcode canvas { margin: 0 auto; border-radius: 0; }
        @keyframes fade-in-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .toast { animation: fade-in-up 0.3s ease-out; }
        input { background: #0b0f14; border: 1px solid #21262d; color: #e1e7ef; }
        input:focus { border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1); outline: none; }
        .btn-cyan { background: linear-gradient(135deg, #02727e, #06b6d4); transition: all 0.2s; }
        .btn-cyan:hover { box-shadow: 0 8px 25px -5px rgba(6, 182, 212, 0.3); }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0b0f14; } ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 3px; }
        /* Theme Toggle */
        [data-theme="light"] { --bg: #f5f7fa; --surface: #ffffff; --border: #d1d5db; --text: #1a1a2e; --muted: #6b7280; --accent: #0284c7; }
        [data-theme="light"] body { background: var(--bg) !important; color: var(--text) !important; }
        [data-theme="light"] .nav-bar, [data-theme="light"] nav { background: rgba(255,255,255,0.95) !important; border-color: var(--border) !important; }
        [data-theme="light"] .glass-card { background: rgba(255,255,255,0.8) !important; border-color: rgba(0,0,0,0.08) !important; }
        [data-theme="light"] .module-card { background: var(--surface) !important; border-color: var(--border) !important; }
        [data-theme="light"] .icon-box { background: rgba(2,114,126,0.08) !important; border-color: rgba(2,114,126,0.15) !important; }
        [data-theme="light"] .text-\[\#e1e7ef\] { color: var(--text) !important; }
        [data-theme="light"] .text-\[\#484f58\] { color: var(--muted) !important; }
        [data-theme="light"] .text-white { color: var(--text) !important; }
        [data-theme="light"] .border-\[\#21262d\] { border-color: var(--border) !important; }
        [data-theme="light"] .bg-\[\#0b0f14\] { background: var(--bg) !important; }
        [data-theme="light"] .bg-\[\#161b22\] { background: var(--surface) !important; }
        [data-theme="light"] .hover\:border-\[\#02727e\]:hover { border-color: var(--accent) !important; }
        [data-theme="light"] input, [data-theme="light"] textarea, [data-theme="light"] select { background: var(--surface) !important; border-color: var(--border) !important; color: var(--text) !important; }
    </style>
</head>
<body class="flex flex-col font-sans text-[#e1e7ef]">

    <nav class="nav-bar px-4 md:px-8 py-3 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="index.html" class="flex items-center gap-2 text-[#484f58] hover:text-[#06b6d4] transition-colors" style="flex-shrink:0;white-space:nowrap">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span class="text-[10px] font-bold tracking-wider" style="color:#06b6d4">← VOLTAR</span>
            </a>
            <span class="w-px h-5 bg-[#21262d]" style="flex-shrink:0"></span>
            <span class="text-xs font-bold text-[#484f58] uppercase" style="flex-shrink:0">Módulo 7</span>
            <span class="w-px h-5 bg-[#21262d]" style="flex-shrink:0"></span>
            <span class="text-sm font-bold text-[#e1e7ef]" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">Gerador de QR Code</span>
        </div>
        <span class="text-[10px] font-bold text-[#484f58]">Thomas Tech</span>
    </nav>

    <div class="flex-1 flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl p-8 w-full max-w-sm text-center" style="border-top: 6px solid #06b6d4;">
            <div class="mb-6">
                <h1 class="text-2xl font-black text-[#e1e7ef]">Gerador QR</h1>
                <div class="inline-block px-3 py-1 rounded-full text-xs font-bold mt-2" style="background: rgba(6,182,212,0.1); color: #06b6d4;">StorSistemas</div>
            </div>

            <div class="p-2 rounded-xl inline-block mb-6" style="background: rgba(11,15,20,0.5);">
                <div id="qrcode" class="flex justify-center min-h-[200px] items-center"></div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="downloadQR()" class="btn-cyan flex flex-col items-center justify-center p-3 rounded-xl text-white shadow-md active:scale-95 cursor-pointer">
                    <i data-lucide="download" class="w-6 h-6 mb-1"></i>
                    <span class="text-xs font-semibold">Baixar PNG</span>
                </button>
                <button onclick="copyQR()" class="flex flex-col items-center justify-center p-3 rounded-xl transition active:scale-95 cursor-pointer" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06); color: #e1e7ef;">
                    <i data-lucide="copy" class="w-6 h-6 mb-1"></i>
                    <span class="text-xs font-semibold">Copiar Imagem</span>
                </button>
            </div>

            <div class="text-left p-3 rounded-lg" style="background: rgba(11,15,20,0.5); border: 1px solid #21262d;">
                <label class="text-[10px] text-[#484f58] font-bold uppercase mb-2 flex justify-between items-center">
                    <span>Conteúdo do QR Code:</span>
                    <span class="text-[9px] text-[#484f58] font-normal">(Edite e clique em Gerar)</span>
                </label>
                <div class="flex gap-2">
                    <input type="text" id="url-input" class="w-full text-xs rounded px-3 py-2" placeholder="Cole seu link aqui..." onkeypress="handleEnter(event)">
                    <button onclick="generateNewQR()" class="btn-cyan text-white text-xs font-bold px-4 py-2 rounded shadow-sm flex items-center gap-1 active:scale-95 cursor-pointer">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                        Gerar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 px-6 py-3 rounded-lg shadow-lg hidden items-center gap-2 text-sm z-50" style="background: #161b22; color: #e1e7ef; border: 1px solid #21262d;">
        <i data-lucide="check-circle" class="w-4 h-4 text-green-400"></i>
        <span id="toast-msg">Mensagem aqui</span>
    </div>

    <script>
        lucide.createIcons();
        const defaultUrl = "https://storsistemas.com.br/aplicativos/storpedidos/StorGarcom(4.8.0.0)-release.apk";
        const urlInput = document.getElementById('url-input');
        const qrcodeContainer = document.getElementById("qrcode");
        urlInput.value = defaultUrl;

        function generateNewQR() {
            const url = urlInput.value.trim();
            if (!url) { showToast("Por favor, insira um link ou texto.", true); return; }
            qrcodeContainer.innerHTML = "";
            new QRCode(qrcodeContainer, { text: url, width: 200, height: 200, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
            showToast("Novo QR Code gerado!");
        }
        generateNewQR();

        function handleEnter(e) { if (e.key === 'Enter') generateNewQR(); }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.className = "fixed bottom-5 px-6 py-3 rounded-lg shadow-lg items-center gap-2 text-sm z-50 toast";
            toast.style.display = 'flex';
            toast.style.background = isError ? '#dc2626' : '#161b22';
            toast.style.color = 'white';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function downloadQR() {
            try {
                const canvas = qrcodeContainer.querySelector('canvas');
                if (!canvas) { showToast("Gere um QR Code primeiro.", true); return; }
                const image = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
                const link = document.createElement('a');
                link.href = image;
                link.download = 'qrcode-storsistemas.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Imagem salva!");
            } catch (err) { showToast("Erro ao baixar.", true); }
        }

        function copyQR() {
            try {
                const canvas = qrcodeContainer.querySelector('canvas');
                if (!canvas) { showToast("Gere um QR Code primeiro.", true); return; }
                canvas.toBlob(async (blob) => {
                    try {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                        showToast("Copiado para a área de transferência!");
                    } catch (err) { showToast("Erro ao copiar. Tente baixar.", true); }
                });
            } catch (err) { showToast("Erro ao copiar.", true); }
        }
    </script>
<script>
(function(){var t=localStorage.getItem('theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');function toggle(){var h=document.documentElement;if(h.getAttribute('data-theme')==='light'){h.removeAttribute('data-theme');localStorage.setItem('theme','dark');}else{h.setAttribute('data-theme','light');localStorage.setItem('theme','light');}}var nav=document.querySelector('nav')||document.querySelector('.nav-bar');if(nav){var btn=document.createElement('button');btn.innerHTML=document.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️';btn.style.cssText='background:none;border:none;cursor:pointer;font-size:18px;padding:2px 8px;margin-left:auto;line-height:1';btn.title='Alternar tema claro/escuro';btn.onclick=toggle;nav.appendChild(btn);}
})();
</script>
</body>
</html>
