        const listEl = document.getElementById('rejeicoesList');
        const searchInput = document.getElementById('searchInput');
        const resultsCount = document.getElementById('resultsCount');

        function render(list) {
            listEl.innerHTML = '';
            resultsCount.textContent = `${list.length} ${list.length === 1 ? 'resultado' : 'resultados'}`;

            if (list.length === 0) {
                listEl.innerHTML = `
                    <div class="no-results">
                        <i data-lucide="alert-triangle" style="width:48px;height:48px;opacity:0.5;"></i>
                        <p>Nenhuma rejeição encontrada para "${searchInput.value}".</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            list.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'rejeicao-card';
                card.style.animation = `fadeIn 0.3s ease ${idx * 0.03}s both`;
                card.innerHTML = `
                    <div class="rejeicao-codigo"><span>Cód. ${item.codigo}</span></div>
                    <div class="rejeicao-texto">${item.resultado}</div>
                    <div class="rejeicao-actions">
                        <a href="${item.linkSolucao}" target="_blank" rel="noopener noreferrer" class="btn-solucao" title="Ver solução detalhada na TecnoSpeed">
                            <i data-lucide="external-link" style="width:16px;height:16px;"></i> Ver Solução
                        </a>
                    </div>`;
                listEl.appendChild(card);
            });
            lucide.createIcons();
        }

        searchInput.addEventListener('input', () => {
            const term = searchInput.value.toLowerCase().trim();
            const filtered = rejeicoesDados.filter(d =>
                d.codigo.includes(term) || d.resultado.toLowerCase().includes(term)
            );
            render(filtered);
        });

        render(rejeicoesDados);
